trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-22.04'

steps:
- checkout: self
  clean: true
  displayName: 'Checkout with clean workspace'

- task: UseDotNet@2
  displayName: 'Setup .NET'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

- script: dotnet restore
  displayName: 'Restore dependencies'

- script: dotnet build --no-restore
  displayName: 'Build'

- script: |
    pwsh Playwright001/bin/Debug/net10.0/playwright.ps1 install --with-deps
  displayName: 'Install Playwright browsers'

- script: |
    ls -la Playwright001/bin/Debug/net10.0/
    pwsh Playwright001/bin/Debug/net10.0/playwright.ps1 --version
  displayName: 'Verify Playwright installation'

# Run tests and ensure Extent Report is generated
- script: |
    echo "=== RUNNING TESTS WITH EXTENT REPORT ==="
    
    # Ensure Reports directory exists with proper permissions
    mkdir -p Playwright001/Reports
    chmod 777 Playwright001/Reports
    
    # Clean any old reports
    rm -rf Playwright001/Reports/*.html
    rm -rf Playwright001/Reports/*.json
    
    # Run tests - Extent Report will generate automatically
    dotnet test --no-build \
      --verbosity normal \
      --logger "console;verbosity=detailed"
    
    # Check if Extent Report was generated
    echo "=== CHECKING FOR EXTENT REPORTS ==="
    find . -name "*.html" -type f | grep -i extent || echo "No Extent HTML found"
    find . -name "Extent*.html" -type f || echo "No Extent HTML found"
    find . -name "index.html" -type f || echo "No index.html found"
    
    # Check Reports directory
    echo "=== CONTENTS OF Reports DIRECTORY ==="
    ls -la Playwright001/Reports/ || echo "Reports directory is empty"
    
    # Also check if Extent Report is in the output directory
    echo "=== CONTENTS OF OUTPUT DIRECTORY ==="
    ls -la Playwright001/bin/Debug/net10.0/ | grep -E "\.html|\.json" || echo "No HTML/JSON in output"
    
    # If report is in bin directory, copy it to Reports
    echo "=== COPYING REPORTS FROM BIN TO REPORTS ==="
    cp -v Playwright001/bin/Debug/net10.0/*.html Playwright001/Reports/ 2>/dev/null || echo "No HTML in bin"
    cp -v Playwright001/bin/Debug/net10.0/extent*.html Playwright001/Reports/ 2>/dev/null || echo "No Extent HTML in bin"
    
    # Final check
    echo "=== FINAL CONTENTS OF Reports DIRECTORY ==="
    ls -la Playwright001/Reports/
    
  displayName: 'Run Tests with Extent Report'
  continueOnError: true

# Publish test results to Azure DevOps
- task: PublishTestResults@2
  displayName: 'Publish Test Results to Azure DevOps'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(System.DefaultWorkingDirectory)'
    mergeTestResults: true
    failTaskOnFailedTests: false

# Publish Extent Report as HTML artifact
- task: PublishPipelineArtifact@1
  displayName: 'Publish Extent Report'
  condition: succeededOrFailed()
  inputs:
    targetPath: 'Playwright001/Reports'
    artifact: 'Extent-Report-$(Build.BuildId)'
    publishLocation: 'pipeline'

# Also publish the entire bin directory to find where report is generated
- task: PublishPipelineArtifact@1
  displayName: 'Publish Bin Directory (Debug)'
  condition: succeededOrFailed()
  inputs:
    targetPath: 'Playwright001/bin/Debug/net10.0'
    artifact: 'Debug-Output-$(Build.BuildId)'
    publishLocation: 'pipeline'

# Copy and publish failure screenshots
- task: CopyFiles@2
  displayName: 'Copy failure screenshots to staging'
  condition: failed()
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: '**/failure-*.png'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/screenshots'
    flattenFolders: true

- task: PublishPipelineArtifact@1
  displayName: 'Publish failure screenshots'
  condition: failed()
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/screenshots'
    artifactName: 'playwright-screenshots-$(Build.BuildId)'
    publishLocation: 'pipeline'